name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Configure the bench
        run: cmake -S . -B build-bench -DWOODSHED_BENCH_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build the bench
        run: cmake --build build-bench --target WoodshedBench --config Release --parallel 4

      - name: Run the bench
        shell: bash
        env:
          WOODSHED_BENCH_CPU_SCALE: "4"
        run: |
          BENCH=build-bench/WoodshedBench_artefacts/Release/WoodshedBench
          [ -f "$BENCH.exe" ] && BENCH="$BENCH.exe"
          RUN=""
          [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          for suite in run project instruments drummer score pitchcorrect presets mix sampler loopgrid; do
            echo "::group::woodshed-bench $suite"
            $RUN "$BENCH" $suite
            echo "::endgroup::"
          done

      - name: Configure the studio
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the studio
        run: cmake --build build --target WoodshedStudio --config Release --parallel 4
